# Redirección HTTP -> HTTPS
server {
    listen 80;
    server_name _;
    
    # Logs
    access_log /var/log/nginx/vozipomni_http_access.log;
    error_log /var/log/nginx/vozipomni_http_error.log;
    
    # Health check endpoint (debe estar ANTES del redirect)
    location /health {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }
    
    # Redirigir todo lo demás a HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS Server
server {
    listen 443 ssl;
    http2 on;
    server_name _;
    charset utf-8;

    # Certificados SSL
    ssl_certificate /etc/nginx/ssl/vozipomni.crt;
    ssl_certificate_key /etc/nginx/ssl/vozipomni.key;

    # Configuración SSL moderna y segura
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;

    # HSTS — obliga al navegador a usar HTTPS durante 2 años (63072000 seg)
    # includeSubDomains y preload permiten registro en la lista HSTS preload de navegadores
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # Content-Security-Policy — restringe origen de recursos para mitigar XSS
    # 'self'             = mismo origen (la app)
    # wss:               = WebSockets (necesario para JsSIP/WebRTC)
    # data:              = íconos/fuentes inline
    # blob:              = grabaciones de audio (MediaRecorder)
    # 'unsafe-inline'   = estilos inline (Nuxt UI / Tailwind CSS)
    # Los recursos de stun/turn son conexiones WebRTC, no HTTP → no aplican CSP
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' wss: ws:; media-src 'self' blob:; frame-ancestors 'none';" always;

    # Permissions-Policy — deshabilitar APIs del navegador no usadas
    add_header Permissions-Policy "geolocation=(), camera=(), payment=(), usb=()";

    # Variables para proxy_pass
    # IMPORTANTE: Usar 127.0.0.1 porque todos los servicios usan network_mode: host
    # Con network_mode: host NO funcionan nombres de servicios Docker (backend, frontend)
    set $backend_upstream http://127.0.0.1:8000;
    set $daphne_upstream http://127.0.0.1:8001;
    set $frontend_upstream http://127.0.0.1:3000;
    # Asterisk WebSocket plano (sin TLS) para JsSIP/WebRTC via Kamailio
    set $kamailio_ws_upstream http://127.0.0.1:8080;
    # Asterisk WebRTC directo (WSS nativo de Asterisk PJSIP)
    set $asterisk_wss_upstream https://127.0.0.1:8089;
    
    # Límites de tamaño
    client_max_body_size 100M;
    
    # Compresión
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json;
    
    # Security headers (los duplicados de HSTS/CSP/Permissions-Policy
    # ya están definidos arriba; aquí solo los complementarios)
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    
    # Logs
    access_log /var/log/nginx/vozipomni_access.log;
    error_log /var/log/nginx/vozipomni_error.log;

    # Iconos de Nuxt desde /api/_nuxt_icon/ - reescribir y enviar al frontend
    location /api/_nuxt_icon/ {
        rewrite ^/api/_nuxt_icon/(.*) /_nuxt_icon/$1 break;
        proxy_pass $frontend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        
        # Cache para JSON de iconos
        add_header Cache-Control "public, max-age=3600";
    }

    # Iconos de Nuxt directos
    location /_nuxt_icon/ {
        proxy_pass $frontend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        
        # Cache para JSON de iconos
        add_header Cache-Control "public, max-age=3600";
    }

    # Archivos estáticos de Nuxt (_nuxt/)
    location ~* ^/_nuxt/ {
        proxy_pass $frontend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        
        # Cache agresivo para archivos estáticos
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Frontend (Nuxt 3)
    location / {
        proxy_pass $frontend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # API Backend
    location /api/ {
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        
        # Timeouts
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # Admin Django
    location /admin/ {
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # WebSocket connections (WSS) → Daphne ASGI (puerto 8001)
    location /ws/ {
        proxy_pass $daphne_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }

    # SIP WebSocket para JsSIP/WebRTC → Kamailio WS (puerto 8080) → Asterisk:5080
    # nginx termina TLS; Kamailio recibe WS plano y actúa de proxy SIP
    # Validación del ticket del softphone (emitido por /api/telephony/webrtc-credentials/).
    # Sin ticket válido no se abre el WebSocket SIP → nadie sin sesión puede registrar ni marcar.
    location = /_sip_ws_auth {
        internal;
        proxy_pass $backend_upstream/api/telephony/sip-ws-auth/;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /sip/ws {
        auth_request /_sip_ws_auth;
        proxy_pass $kamailio_ws_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_read_timeout 7200;
        proxy_send_timeout 7200;
    }

    # WebRTC directo → Asterisk PJSIP WSS (puerto 8089)
    # JsSIP se conecta aquí; Asterisk maneja DTLS-SRTP nativamente
    # nginx actúa de proxy SSL → SSL (proxy_ssl_verify off para cert autofirmado de Asterisk)
    location /asterisk/ws {
        auth_request /_sip_ws_auth;
        proxy_pass $asterisk_wss_upstream;
        proxy_ssl_verify off;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }

    # Archivos estáticos de Django
    location /static/ {
        alias /app/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Archivos de medios
    location /media/ {
        alias /app/media/;
        expires 30d;
        add_header Cache-Control "public";
    }

    # Grabaciones de llamadas
    location /recordings/ {
        alias /app/recordings/;
        expires 7d;
        add_header Cache-Control "private";
        
        # Autenticación requerida (manejar en Django)
        proxy_pass $backend_upstream;
    }

    # Health check
    location /health {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }
}
