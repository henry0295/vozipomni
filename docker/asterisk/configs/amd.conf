;============================================================================
; VoziPOmni - Detección de contestador automático (app_amd)
; Usado por el contexto [outbound-queue] cuando la campaña tiene AMD activo.
; Valores en milisegundos. Ajustar si el operador tiene saludos muy cortos o
; si se detectan personas como contestador (falsos positivos).
;============================================================================
[general]
; Silencio máximo antes de que la persona hable (si se excede → MACHINE)
initial_silence = 2500
; Duración máxima del saludo de una persona ("¿Aló?"). Más largo → MACHINE
greeting = 1500
; Silencio después del saludo que indica que es una persona esperando respuesta
after_greeting_silence = 800
; Tiempo total de análisis antes de decidir NOTSURE
total_analysis_time = 5000
; Duración mínima para contar un sonido como palabra
min_word_length = 100
; Silencio mínimo entre palabras
between_words_silence = 50
; Más palabras que esto en el saludo → MACHINE
maximum_number_of_words = 3
; Umbral de energía para considerar silencio (0-32767)
silence_threshold = 256
; Una "palabra" más larga que esto → MACHINE (mensaje grabado)
maximum_word_length = 5000
