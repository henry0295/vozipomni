;============================================================================
; VoziPOmni Contact Center - AMI Configuration
;============================================================================

[general]
enabled = yes
port = 5038
bindaddr = 0.0.0.0
displayconnects = yes
timestampevents = yes
; Cierra conexiones que no se autentican en 3s (default 30s).
; Evita que sockets huérfanos agoten file descriptors.
authtimeout = 3
; Máximo 50 conexiones AMI simultáneas (default sin límite).
authlimit = 50

; Usuario AMI para VoziPOmni
[admin]
; El entrypoint reemplaza este marcador con ASTERISK_AMI_PASSWORD.
secret = CHANGE_ME_RUNTIME
deny=0.0.0.0/0.0.0.0
permit=127.0.0.1/255.255.255.255
permit=AMI_NETWORK_RUNTIME
read = system,call,log,verbose,agent,user,config,dtmf,reporting,cdr,dialplan,originate,message
write = system,call,agent,user,config,command,reporting,originate,message
writetimeout = 5000
