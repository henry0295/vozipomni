; logger.conf — VozipCX
; /var/log/asterisk está montado en ./logs/asterisk del host: fail2ban lee
; "messages" para bloquear intentos fallidos de autenticación AMI/SIP.
[general]
dateformat = %F %T
rotatestrategy = rotate

[logfiles]
console => notice,warning,error
messages => security,notice,warning,error
