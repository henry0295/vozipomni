name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      DEBUG: 'False'
      SECRET_KEY: ci-secret-key
      FIELD_ENCRYPTION_KEY: ZHVtbXkta2V5LWZvci10ZXN0
      ALLOWED_HOSTS: localhost
      CORS_ORIGINS: http://localhost
      DB_HOST: localhost
      DB_NAME: vozipomni
      DB_USER: vozipomni
      DB_PASSWORD: postgres
      REDIS_URL: redis://localhost:6379/0
      POSTGRES_PASSWORD: postgres
      REDIS_PASSWORD: redis
    services:
      postgres:
        image: postgres:14-alpine
        env:
          POSTGRES_DB: vozipomni
          POSTGRES_USER: vozipomni
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U vozipomni -d vozipomni"
          --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 5
        ports: ['6379:6379']
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt ruff bandit
      - run: python manage.py check --deploy
      - run: ruff check .
      - run: bandit -r apps core config -q
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
            cache: npm
          - run: npm install
      - run: npm run lint
      - run: npx vue-tsc --noEmit
      - run: npm run build

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
      - uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          ignore-unfixed: true

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate production compose with dummy values
        env:
          VOZIPOMNI_IPV4: 127.0.0.1
          ALLOWED_HOSTS: localhost
          CORS_ORIGINS: https://localhost
          SECRET_KEY: ci-secret
          POSTGRES_PASSWORD: ci-db-password
          REDIS_PASSWORD: ci-redis-password
          ASTERISK_AMI_USER: ci-ami
          ASTERISK_AMI_PASSWORD: ci-ami-password
          FIELD_ENCRYPTION_KEY: ZHVtbXkta2V5LWZvci10ZXN0
          GRAFANA_PASSWORD: ci-grafana-password
        run: docker compose -f docker-compose.prod.yml config --quiet